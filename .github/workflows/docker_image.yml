name: Docker Image build and publish

env:
  CACHE_FROM: type=gha,scope=simdb-server
  CACHE_TO: type=gha,mode=max,scope=simdb-server
  SETUPTOOLS_SCM_OVERRIDES_FOR_IMAS_SIMDB: '{local_scheme = "no-local-version-strict"}'

on:
  # Triggers on pushes to develop, on pushed tags, and on pull requests targeting develop.
  push:
    branches: [ "develop" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: Build, verify, and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Get package version
      id: version
      run: echo "value=$(git describe --tags --long --always | sed -r 's/-([0-9]+)/.dev\1/;s/-/+/')" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build build image
      uses: docker/build-push-action@v7
      with:
        target: build
        load: true
        tags: simdb-server:build
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build validation image
      uses: docker/build-push-action@v7
      with:
        target: test
        load: true
        tags: simdb-server:test
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build service image
      uses: docker/build-push-action@v7
      with:
        target: service
        load: true
        tags: simdb-server:service
        build-args: APP_VERSION=${{ steps.version.outputs.value }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Export service image tar
      run: docker save -o "${{ runner.temp }}/simdb-server-service.tar" simdb-server:service

    - name: Upload service image artifact
      uses: actions/upload-artifact@v7
      with:
        name: simdb-server-service
        path: ${{ runner.temp }}/simdb-server-service.tar
        retention-days: 7

  verify:
    name: Verify Docker validation stage
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build validation stage only
      uses: docker/build-push-action@v7
      with:
        target: test
        load: true
        tags: simdb-server:test
        build-args: APP_VERSION=0.0.0
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

  publish:
    name: Publish service image
    # Runs only for push events (branch/tag pushes), and is skipped for pull_request events.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
    steps:
    - name: Lowercase repo-owner
      id: repo_owner
      run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

    - name: Download service image artifact
      uses: actions/download-artifact@v8
      with:
        name: simdb-server-service
        path: ${{ runner.temp }}

    - name: Load service image
      run: docker load -i "${{ runner.temp }}/simdb-server.tar"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ steps.repo_owner.outputs.value }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag and push service image with versioned tag and "nightly"
      if: ${{ github.ref_type == 'branch' }}
      run: |
        docker tag simdb-server:service ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:${{ needs.build.outputs.version }}
        docker tag simdb-server:service ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:nightly
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:${{ needs.build.outputs.version }}
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:nightly


    # These steps run on tagged commits only
    - name: Tag and push latest
      if: ${{ github.ref_type == 'tag' }}
      run: |
        docker tag \
          simdb-server:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:latest
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:latest

